version: '3.8'

services:
  pii-shield-db:
    build: .
    container_name: mcp-pii-shield
    ports:
      - "3088:3000"
    environment:
      - TRANSPORT=sse
      - PORT=3000
      - PGHOST=${PGHOST:-localhost}
      - PGPORT=${PGPORT:-5432}
      - PGUSER=${PGUSER:-postgres}
      - PGPASSWORD=${PGPASSWORD:-change_me}
      - PGDATABASE=${PGDATABASE:-your_database}
      - MCP_API_KEY=${MCP_API_KEY}
      - ROSTER_PATH=${ROSTER_PATH:-./entityRoster.json}
    restart: always
